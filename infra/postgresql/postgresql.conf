# Server
listen_addresses = '*'

# Connections
#
# The default is 100, which OpenFGA's pool alone is allowed to
# fill (OPENFGA_DATASTORE_MAX_OPEN_CONNS in compose.yaml). One
# conformance run leaves that pool warm, and the next thing to
# want a connection -- @tsfga/kysely's migration test, which
# opens an admin client to create a scratch database -- is
# refused with "sorry, too many clients already" and reports it
# as a migration failure.
#
# So the two are now set apart rather than equal: OpenFGA may
# hold 50, leaving the rest for the adapter tests, the
# conformance clients and kysely-ctl.
max_connections = 200

# Logging
log_statement = 'all'
log_destination = 'stderr'
