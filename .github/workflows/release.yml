name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options:
          - "@tsfga/core"
          - "@tsfga/kysely"
      publish:
        description: >-
          Publish to npm (default: validate only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.package }}

jobs:
  release:
    if: github.repository == 'emfga/tsfga'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Elevated only here, so a job added later inherits the
    # workflow's contents: read instead of these. A job-level
    # block replaces the workflow-level one rather than
    # merging, so contents: write is restated.
    permissions:
      contents: write # push the tag, create the release
      id-token: write # npm Trusted Publishing OIDC exchange
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, and the
      # publish toolchain comes from the Node pin: setup-node
      # ships no npm of its own, it uses the distribution's
      # bundled one. Node 24.19.0 bundles npm 11.17.0. The 22.x
      # line never moved past npm 10 (22.23.2 is still on
      # 10.9.8), which has no OIDC support at all -- that is
      # why this is not on 22. Pinning Node exactly also pins
      # npm, so the toolchain cannot change between a validate
      # run and a publish run.
      #
      # registry-url is deliberately not set: npm already
      # defaults to registry.npmjs.org, and the
      # ${NODE_AUTH_TOKEN} placeholder it would write into
      # .npmrc turns a failed OIDC exchange into an opaque E401
      # instead of the ENEEDAUTH the checks below explain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      # Ungated on purpose, and placed here rather than beside
      # the OIDC check: this is the earliest proof the publish
      # toolchain is sane, it costs two seconds, and it runs on
      # validate-only dispatches too -- which is exactly the
      # rehearsal that would otherwise give no signal about it.
      - name: Verify npm supports Trusted Publishing
        run: |
          version=$(npm --version)
          echo "npm ${version} at $(command -v npm)"
          required=11.5.1
          oldest=$(
            printf '%s\n%s\n' "$required" "$version" \
              | sort -V | head -n 1
          )
          if [ "$oldest" != "$required" ]; then
            echo "::error::npm ${version} predates Trusted" \
              "Publishing support (needs >= ${required}), so" \
              "publish would fail with ENEEDAUTH."
            exit 1
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - run: bun install --frozen-lockfile

      - name: Map package to directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            "@tsfga/core")  dir="packages/core" ;;
            "@tsfga/kysely") dir="packages/kysely" ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Lets a re-run after a partial failure (publish
      # succeeded, tag/release did not) skip the publish and
      # finish the remaining steps.
      #
      # Only a definitive E404 counts as "not published". npm
      # view also exits non-zero on registry 5xx, timeouts and
      # rate limiting, and treating those as "absent" would
      # make exactly that re-run try to republish, fail with
      # EPUBLISHCONFLICT before reaching the tag steps, and
      # leave the tag missing on every attempt.
      - name: Check if already published
        id: published
        run: |
          pkg="${{ inputs.package }}"
          ver="${{ steps.version.outputs.version }}"
          if out=$(npm view "${pkg}@${ver}" version 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${pkg}@${ver} is already on" \
              "npm; publish will be skipped."
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${pkg}@${ver} is not yet published."
          else
            echo "::error::npm view failed for a reason other" \
              "than E404, so whether ${pkg}@${ver} is already" \
              "published is unknown. Refusing to guess."
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Build all packages
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Run migrations
        run: bun run db:latest

      - name: Run tests (Bun)
        run: bun run turbo:test

      - name: Run tests (Node.js)
        run: bun run turbo:test:node

      - name: Run tests (Deno)
        run: bun run turbo:test:deno

      # The last gate before anything reaches npm. CI already
      # runs this on every PR; repeating it here means a
      # dispatch from a branch that never opened a PR cannot
      # publish an adapter whose peer range excludes the
      # current core.
      - name: Check peer range
        run: bun run check:peer-range

      # Runs before the packaging checks, and regardless of
      # whether this dispatch publishes, so publint / attw /
      # npm pack inspect the manifest that actually ships. When
      # this ran afterwards, devDependencies still read
      # "workspace:*" at validation time and the substituted
      # string was never linted at all.
      #
      # devDependencies only. peerDependencies is hand-written
      # in package.json and ships verbatim: deriving it from the
      # core version wrote "^0.4.0", which below 1.0.0 excludes
      # every later minor, so publishing core 0.5.0 left the
      # published adapter uninstallable beside it.
      - name: Resolve workspace protocol
        if: inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          core_ver=$(
            jq -r .version packages/core/package.json
          )
          jq --arg v "$core_ver" \
            '.devDependencies["@tsfga/core"] = $v' \
            "${dir}/package.json" > "${dir}/package.tmp"
          mv "${dir}/package.tmp" "${dir}/package.json"

      # attw ignores node10/node16-cjs resolutions: the packages
      # are deliberately ESM-only (see Q3 in the release plan).
      - name: Packaging checks
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          bunx publint
          bunx attw --pack . --profile esm-only
          npm pack --dry-run

      - name: Validation summary
        if: "!inputs.publish"
        run: echo "Validation complete. Skipping publish."

      # npm skips the OIDC exchange silently (log.silly) when
      # the id-token request variables are missing, then fails
      # with a bare ENEEDAUTH that names the wrong cause. The
      # npm version half of this is asserted right after
      # setup-node; this half only matters when publishing.
      - name: Verify Trusted Publishing preconditions
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] \
            || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC id-token request variables are" \
              "missing. npm cannot use Trusted Publishing and" \
              "will fail with ENEEDAUTH. Check that the job has" \
              "id-token: write."
            exit 1
          fi
          echo "OIDC id-token endpoint is available."

      # --loglevel verbose: every OIDC failure inside npm is
      # logged below the default level, so a misconfigured
      # trusted publisher would otherwise surface as ENEEDAUTH
      # with no explanation.
      - name: Publish to npm
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm publish --provenance --access public \
            --loglevel verbose

      # always(): the resolve above is no longer gated on
      # publishing, so the tree must be restored even when the
      # publish step failed or was skipped.
      - name: Revert workspace resolution
        if: always() && inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          git checkout "${dir}/package.json"

      - name: Create git tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify \
            "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; skipping."
          else
            git tag "$tag"
          fi

      - name: Push tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          git push origin "$tag"

      - name: Find previous tag
        if: inputs.publish
        id: prev-tag
        run: |
          pkg="${{ inputs.package }}"
          current="${{ steps.version.outputs.version }}"
          prev=$(
            git tag --list "${pkg}@*" --sort=-v:refname \
              | grep -v "${pkg}@${current}" \
              | head -n 1 || true
          )
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: inputs.publish
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(
            bash scripts/release-notes.sh \
              "${{ steps.prev-tag.outputs.tag }}"
          )
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$NOTES"
          fi
