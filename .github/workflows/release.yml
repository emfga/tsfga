name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options:
          - "@tsfga/core"
          - "@tsfga/kysely"
      publish:
        description: >-
          Publish to npm (default: validate only)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.package }}

jobs:
  release:
    if: github.repository == 'emfga/tsfga'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repeated at job level: the runner only injects
    # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN when the job
    # itself carries id-token: write, and npm needs both
    # to exchange an OIDC token for a publish token.
    permissions:
      contents: write
      id-token: write
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.6.x"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Pin an
      # exact version so the publish toolchain cannot change
      # between a validate run and the publish run.
      #
      # Install into an explicit prefix and put that first on
      # PATH rather than self-updating the global npm: where a
      # bare "npm install -g npm" lands depends on the ambient
      # prefix, and when it landed off-PATH the publish step
      # silently kept using Node's bundled npm 10, which has no
      # OIDC support at all.
      - name: Install npm with Trusted Publishing support
        run: |
          npm install -g --prefix "${RUNNER_TEMP}/npm-cli" \
            npm@11.19.0
          echo "${RUNNER_TEMP}/npm-cli/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      - name: Map package to directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            "@tsfga/core")  dir="packages/core" ;;
            "@tsfga/kysely") dir="packages/kysely" ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Non-fatal so a re-run after a partial failure (publish
      # succeeded, tag/release did not) can skip the publish and
      # still finish the remaining steps.
      - name: Check if already published
        id: published
        run: |
          pkg="${{ inputs.package }}"
          ver="${{ steps.version.outputs.version }}"
          if npm view "${pkg}@${ver}" version \
            > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${pkg}@${ver} is already on" \
              "npm; publish will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${pkg}@${ver} is not yet published."
          fi

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Build all packages
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Run migrations
        run: bun run db:latest

      - name: Run tests (Bun)
        run: bun run turbo:test

      - name: Run tests (Node.js)
        run: bun run turbo:test:node

      - name: Run tests (Deno)
        run: bun run turbo:test:deno

      # attw ignores node10/node16-cjs resolutions: the packages
      # are deliberately ESM-only (see Q3 in the release plan).
      - name: Packaging checks
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          bunx publint@0.3.23
          bunx @arethetypeswrong/cli@0.18.5 \
            --pack . --profile esm-only
          npm pack --dry-run

      - name: Validation summary
        if: "!inputs.publish"
        run: echo "Validation complete. Skipping publish."

      - name: Resolve workspace protocol
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
          && inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          core_ver=$(
            jq -r .version packages/core/package.json
          )
          jq --arg v "^$core_ver" \
            '.peerDependencies["@tsfga/core"] = $v
             | .devDependencies["@tsfga/core"] = $v' \
            "${dir}/package.json" > "${dir}/package.tmp"
          mv "${dir}/package.tmp" "${dir}/package.json"

      # npm skips the OIDC exchange silently (log.silly) when
      # it is too old or the id-token request variables are
      # missing, then fails with a bare ENEEDAUTH that names
      # the wrong cause. Check both preconditions up front.
      - name: Verify Trusted Publishing preconditions
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
        run: |
          version=$(npm --version)
          echo "npm ${version} at $(command -v npm)"
          required=11.5.1
          older=$(
            printf '%s\n%s\n' "$required" "$version" \
              | sort -V | head -n 1
          )
          if [ "$older" != "$required" ]; then
            echo "::error::npm ${version} predates Trusted" \
              "Publishing support (needs >= ${required}), so" \
              "publish would fail with ENEEDAUTH."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] \
            || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC id-token request variables are" \
              "missing. npm cannot use Trusted Publishing and" \
              "will fail with ENEEDAUTH. Check that the job has" \
              "id-token: write."
            exit 1
          fi
          echo "OIDC id-token endpoint is available."

      # --loglevel verbose: every OIDC failure inside npm is
      # logged below the default level, so a misconfigured
      # trusted publisher would otherwise surface as ENEEDAUTH
      # with no explanation.
      - name: Publish to npm
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm publish --provenance --access public \
            --loglevel verbose

      - name: Revert workspace resolution
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
          && inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          git checkout "${dir}/package.json"

      - name: Create git tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify \
            "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; skipping."
          else
            git tag "$tag"
          fi

      - name: Push tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          git push origin "$tag"

      - name: Find previous tag
        if: inputs.publish
        id: prev-tag
        run: |
          pkg="${{ inputs.package }}"
          current="${{ steps.version.outputs.version }}"
          prev=$(
            git tag --list "${pkg}@*" --sort=-v:refname \
              | grep -v "${pkg}@${current}" \
              | head -n 1 || true
          )
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: inputs.publish
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(
            bash scripts/release-notes.sh \
              "${{ steps.prev-tag.outputs.tag }}"
          )
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$NOTES"
          fi
