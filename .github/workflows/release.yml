name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options:
          - "@tsfga/core"
          - "@tsfga/kysely"
      publish:
        description: >-
          Publish to npm (default: validate only)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.package }}

jobs:
  release:
    if: github.repository == 'emfga/tsfga'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: "2.6.x"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Pin an
      # exact version so the publish toolchain cannot change
      # between a validate run and the publish run.
      - run: npm install -g npm@11.19.0

      - run: bun install --frozen-lockfile

      - name: Map package to directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            "@tsfga/core")  dir="packages/core" ;;
            "@tsfga/kysely") dir="packages/kysely" ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Non-fatal so a re-run after a partial failure (publish
      # succeeded, tag/release did not) can skip the publish and
      # still finish the remaining steps.
      - name: Check if already published
        id: published
        run: |
          pkg="${{ inputs.package }}"
          ver="${{ steps.version.outputs.version }}"
          if npm view "${pkg}@${ver}" version \
            > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${pkg}@${ver} is already on" \
              "npm; publish will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${pkg}@${ver} is not yet published."
          fi

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Build all packages
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Run migrations
        run: bun run db:latest

      - name: Run tests (Bun)
        run: bun run turbo:test

      - name: Run tests (Node.js)
        run: bun run turbo:test:node

      - name: Run tests (Deno)
        run: bun run turbo:test:deno

      # attw ignores node10/node16-cjs resolutions: the packages
      # are deliberately ESM-only (see Q3 in the release plan).
      - name: Packaging checks
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          bunx publint@0.3.23
          bunx @arethetypeswrong/cli@0.18.5 \
            --pack . --profile esm-only
          npm pack --dry-run

      - name: Validation summary
        if: "!inputs.publish"
        run: echo "Validation complete. Skipping publish."

      - name: Resolve workspace protocol
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
          && inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          core_ver=$(
            jq -r .version packages/core/package.json
          )
          jq --arg v "^$core_ver" \
            '.peerDependencies["@tsfga/core"] = $v
             | .devDependencies["@tsfga/core"] = $v' \
            "${dir}/package.json" > "${dir}/package.tmp"
          mv "${dir}/package.tmp" "${dir}/package.json"

      - name: Publish to npm
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public

      - name: Revert workspace resolution
        if: >-
          inputs.publish
          && steps.published.outputs.published == 'false'
          && inputs.package == '@tsfga/kysely'
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          git checkout "${dir}/package.json"

      - name: Create git tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify \
            "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; skipping."
          else
            git tag "$tag"
          fi

      - name: Push tag
        if: inputs.publish
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          git push origin "$tag"

      - name: Find previous tag
        if: inputs.publish
        id: prev-tag
        run: |
          pkg="${{ inputs.package }}"
          current="${{ steps.version.outputs.version }}"
          prev=$(
            git tag --list "${pkg}@*" --sort=-v:refname \
              | grep -v "${pkg}@${current}" \
              | head -n 1 || true
          )
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: inputs.publish
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(
            bash scripts/release-notes.sh \
              "${{ steps.prev-tag.outputs.tag }}"
          )
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          tag="${{ inputs.package }}@${{ steps.version.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$NOTES"
          fi
