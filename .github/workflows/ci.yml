name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run biome:check

      # Cheap, needs no build, and gates the one thing a green
      # test suite cannot see: whether the adapter's declared
      # peer range still admits the core it was tested against.
      - run: bun run check:peer-range

      # The write-gate cause inventory is checked against the
      # OpenFGA source it was extracted from, at the SHA it names
      # and the tag `compose.yaml` runs. Needs no database, so it
      # belongs here rather than in the conformance job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openfga/openfga
          ref: 44054f542f64e9b9589dd26a595081b3d2cfd942
          path: .openfga

      - run: bun run check:write-gate-causes
        env:
          OPENFGA_REPO: ${{ github.workspace }}/.openfga

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: |
          bunx commitlint \
            --verbose \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The harness type check ends in `deno check` on the Deno
      # shim, whose jsr: imports tsc cannot resolve.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.x"

      - run: bun install --frozen-lockfile

      - run: bun run tsc

  test-bun:
    # Named by line, not by patch, so a Renovate patch bump does
    # not rename a required status check.
    name: test-bun (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The newest patch of every supported Bun line: the
        # oldest entry is the floor README.md advertises. Renovate
        # bumps each entry's patch and never moves one to another
        # line (see renovate.json); add a line by hand, and add
        # its check to the branch ruleset's required checks.
        include:
          - line: "1.3"
            bun-version: "1.3.14" # renovate: bun
          - line: "1.4"
            bun-version: "1.4.4" # renovate: bun
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install with the packageManager Bun, then switch to the
      # matrix Bun to run everything else. bun.lock's format
      # follows the Bun that wrote it, and an older line cannot
      # parse a newer lockfile (1.3 rejects 1.4's lockfileVersion
      # 2), so installing with the matrix Bun would test the
      # lockfile rather than the runtime.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: bun --version

      - run: docker compose up -d --wait

      - run: bun run db:latest

      # A step in the job that already has the migrated database
      # rather than a job of its own: nothing else checks that the
      # committed schema.ts still describes what the migrations
      # produce, and the compiler cannot, because the payload
      # columns are typed Json.
      - run: bun run check:schema-drift

      - run: bun run turbo:test

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x", "26.x"]
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: docker compose up -d --wait

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run db:latest

      - run: node tests/smoke/smoke-test.mjs

      - run: bun run turbo:test:node

  test-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deno-version: ["2.6.x", "2.9.x"]
    env:
      POSTGRES_DB: dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev
      FGA_API_URL: http://localhost:8080
      PREFIX: tsfga
      DATABASE_URL: postgres://dev:password@localhost:5432/dev
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - run: docker compose up -d --wait

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run db:latest

      - run: deno run --allow-all tests/smoke/smoke-test.mjs

      - run: bun run turbo:test:deno

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Same Node as release.yml pins. Without it this job runs
      # npm pack under the runner image's ambient npm, so it
      # would not actually gate what the release job checks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Mirrors release.yml: resolve workspace:* before the
      # checks, so they inspect the manifest that ships.
      #
      # devDependencies only. peerDependencies is hand-written
      # and published verbatim -- see scripts/check-peer-range.sh
      # for why deriving it from the core version silently
      # orphaned the adapter on every core minor.
      - name: Resolve workspace protocol
        run: |
          core_ver=$(jq -r .version packages/core/package.json)
          dir=packages/kysely
          jq --arg v "$core_ver" \
            '.devDependencies["@tsfga/core"] = $v' \
            "${dir}/package.json" > "${dir}/package.tmp"
          mv "${dir}/package.tmp" "${dir}/package.json"

      # attw ignores node10/node16-cjs resolutions: the
      # packages are deliberately ESM-only.
      #
      # Both tools resolve from node_modules/.bin, so they run
      # at the version bun.lock pinned. Note attw's bin is named
      # "attw" -- invoking it as @arethetypeswrong/cli would
      # match no local bin and silently fetch from the registry.
      - name: Packaging checks
        run: |
          for dir in packages/core packages/kysely; do
            (cd "$dir" && bunx publint)
            bunx attw --pack "$dir" --profile esm-only
            (cd "$dir" && npm pack --dry-run)
          done

      - name: Revert workspace resolution
        if: always()
        run: git checkout packages/kysely/package.json
