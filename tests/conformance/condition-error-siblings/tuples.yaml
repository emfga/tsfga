# anne holds a conditioned direct grant with NO stored context:
# checks without request context fail condition evaluation
- user: user:anne
  relation: viewer
  object: document:1
  condition:
    name: valid_ip

# ...but anne is also a team member, and the team grants viewer
- user: team:eng#member
  relation: viewer
  object: document:1
- user: user:anne
  relation: member
  object: team:eng

# bob is only a team member (no conditioned tuple)
- user: user:bob
  relation: member
  object: team:eng

# carl holds ONLY a conditioned grant on document:2 (no sibling
# grant path exists there)
- user: user:carl
  relation: viewer
  object: document:2
  condition:
    name: valid_ip

# === The sibling matrix ===
#
# Three row flavours, all on the same condition:
#   broken  — no stored context, so a context-free check cannot
#             evaluate it at all
#   cfalse  — stored context that evaluates FALSE
#   good    — stored context that evaluates TRUE
#
# The subtree behind a `good` row is what separates "grants" from
# "valid but denies": anne views fga and fgb, and is a member of
# tga and tgb, but neither fdeny nor tdeny reaches her.

- user: user:anne
  relation: viewer
  object: folder:fga
- user: user:anne
  relation: viewer
  object: folder:fgb
- user: user:bob
  relation: viewer
  object: folder:fdeny

- user: user:anne
  relation: member
  object: team:tga
- user: user:anne
  relation: member
  object: team:tgb
- user: user:bob
  relation: member
  object: team:tdeny

# --- tupleset rows: document.parent, read by ttu_viewer ---

# 1: broken only
- user: folder:fga
  relation: parent
  object: document:t1
  condition:
    name: valid_ip

# 2: broken + good(grants)
- user: folder:fga
  relation: parent
  object: document:t2
  condition:
    name: valid_ip
- user: folder:fgb
  relation: parent
  object: document:t2
  condition:
    name: valid_ip
