    name: valid_ip
    context:
      user_ip: 192.168.0.1
- user: folder:fga
  relation: parent
  object: document:t4r
  condition:
    name: valid_ip

# 5: broken + cfalse + valid-but-denies
- user: folder:fga
  relation: parent
  object: document:t5
  condition:
    name: valid_ip
- user: folder:fgb
  relation: parent
  object: document:t5
  condition:
    name: valid_ip
