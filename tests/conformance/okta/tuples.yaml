# Groups. g_all nests g_eng's direct members, and then excludes bob
# again — an exclusion applied *after* a nested userset resolved it.
- user: user_d4o:alice
  relation: direct_member
  object: group_d4o:g_eng
- user: user_d4o:bob
  relation: direct_member
  object: group_d4o:g_eng
- user: group_d4o:g_eng#direct_member
  relation: direct_member
  object: group_d4o:g_all
- user: user_d4o:carol
  relation: direct_member
  object: group_d4o:g_all
- user: user_d4o:bob
  relation: excluded
  object: group_d4o:g_all

