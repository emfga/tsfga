# Ported from openfga/openfga v1.18.2
# tests/check/complexity_three.go and tests/check/check_complexity4.go.
#
# One store holds every stage, exactly as upstream's
# `or_compute_complex3` stage already does: each stage names its
# objects with its own prefix, so the union of the stages' tuples
# leaves every stage's answers unchanged.

# ---------------------------------------------------------------
# Stage A — ttu_userset_ttu (and compute_/or_compute_ over it)
# complexity3 -userset_parent-> usersets_user
#   -ttu_direct_userset-> ttus#direct_pa_direct_ch
#   -mult_parent_types-> directs_user -direct-> user
# ---------------------------------------------------------------
- user: usersets_user_b2:a1
  relation: userset_parent
  object: complexity3_b2:a1
- user: ttus_b2:a1#direct_pa_direct_ch
  relation: ttu_direct_userset
  object: usersets_user_b2:a1
- user: directs_user_b2:a1
  relation: mult_parent_types
  object: ttus_b2:a1
- user: user_b2:a1
  relation: direct
  object: directs_user_b2:a1

# aud: only the leaf edge exists.
- user: user_b2:aud
  relation: direct
  object: directs_user_b2:aud

# aut: leaf + ttus, nothing above.
- user: user_b2:aut
  relation: direct
  object: directs_user_b2:aut
- user: directs_user_b2:aut
  relation: mult_parent_types
  object: ttus_b2:aut

# auu: leaf + ttus + usersets, no complexity3 edge.
- user: user_b2:auu
  relation: direct
  object: directs_user_b2:auu
- user: directs_user_b2:auu
  relation: mult_parent_types
  object: ttus_b2:auu
- user: ttus_b2:auu#direct_pa_direct_ch
  relation: ttu_direct_userset
  object: usersets_user_b2:auu

# acu: the complexity3 edge alone.
- user: usersets_user_b2:acu
  relation: userset_parent
  object: complexity3_b2:acu

# act: complexity3 + usersets.
- user: usersets_user_b2:act
  relation: userset_parent
  object: complexity3_b2:act
- user: ttus_b2:act#direct_pa_direct_ch
  relation: ttu_direct_userset
  object: usersets_user_b2:act

# acd: everything but the leaf.
- user: usersets_user_b2:acd
  relation: userset_parent
  object: complexity3_b2:acd
- user: ttus_b2:acd#direct_pa_direct_ch
  relation: ttu_direct_userset
  object: usersets_user_b2:acd
- user: directs_user_b2:acd
  relation: mult_parent_types
  object: ttus_b2:acd

# acd2: a complete chain, but to a different user.
- user: usersets_user_b2:acd2
  relation: userset_parent
  object: complexity3_b2:acd2
- user: ttus_b2:acd2#direct_pa_direct_ch
  relation: ttu_direct_userset
  object: usersets_user_b2:acd2
- user: directs_user_b2:acd2
  relation: mult_parent_types
  object: ttus_b2:acd2
- user: user_b2:acd2
  relation: direct
  object: directs_user_b2:acd2

